<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AI Marketplace Phế Liệu</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
      integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/ai-search.css" />
  </head>

  <body class="bg-light">
    <button
      class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4"
      title="Tìm kiếm với AI"
      onclick="
        document.querySelector('#search-container').classList.toggle('d-none')
      "
    >
      <i class="bi bi-robot"></i>
    </button>
    <div class="container d-none bg-light w-100 h-100" id="search-container">
      <!-- SEARCH BOX AI -->
      <div class="card shadow-sm my-4">
        <div class="card-body">
          <h5 class="mb-3">Tìm nguồn hàng bằng AI</h5>

          <div class="row g-2">
            <div class="col-md-6">
              <input
                id="query"
                class="form-control"
                placeholder="VD: mua đồng phế liệu số lượng lớn"
              />
            </div>
            <div class="col-md-3">
              <input
                id="min_stock"
                type="number"
                class="form-control"
                placeholder="Số lượng tối thiểu"
              />
            </div>
            <div class="col-md-3">
              <input
                id="max_price"
                type="number"
                class="form-control"
                placeholder="Giá tối đa (đ)"
              />
            </div>
          </div>

          <button class="btn btn-primary mt-3" onclick="searchAI()">
            🔍 Tìm bằng AI
          </button>
        </div>
      </div>

      <!-- AI EXPLAIN -->
      <div id="ai-explain" class="alert alert-info d-none"></div>

      <!-- RESULT -->
      <div id="results" class="row g-3"></div>
    </div>

    <script src="../js/ai-search.js"></script>
  </body>
</html>
